<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>test-github-actions</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #24292e;
      line-height: 1.6;
    }
    h1 {
      border-bottom: 1px solid #eaecef;
      padding-bottom: 0.3em;
    }
    h2 {
      border-bottom: 1px solid #eaecef;
      padding-bottom: 0.3em;
      margin-top: 24px;
    }
    code {
      background-color: #f6f8fa;
      border-radius: 3px;
      font-size: 85%;
      padding: 0.2em 0.4em;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    pre {
      background-color: #f6f8fa;
      border-radius: 6px;
      padding: 16px;
      overflow: auto;
    }
    pre code {
      background: none;
      padding: 0;
      font-size: 100%;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background-color: #0075ca;
      color: #fff;
      text-decoration: none;
    }
  </style>

<body>
  <h1>test-github-actions</h1>
  <p>用于测试 GitHub Actions 的示例仓库。</p>

  <h2>简介</h2>
  <p>
    本仓库用于探索和验证
    <a href="https://docs.github.com/en/actions">GitHub Actions</a>
    的各项功能，包括自动化工作流、CI/CD 流水线以及与第三方工具的集成。
  </p>

  <h2>快速开始</h2>
  <p>克隆仓库到本地：</p>
  <pre><code>git clone https://github.com/bradenwu/test-github-actions.git
cd test-github-actions</code></pre>

  <h2>GitHub Actions 工作流</h2>
  <p>工作流配置文件位于 <code>.github/workflows/</code> 目录下。</p>

  <h2>许可证</h2>
  <p>本项目仅作学习与测试用途。</p>
